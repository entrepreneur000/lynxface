<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - LynxFace</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-progress-bar" id="top-progress"></div>
  
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <!-- Made logo clickable to go to home page -->
        <a href="index.html" class="flex items-center space-x-2 hover:opacity-80 transition">
          <img src="favicon.png" alt="LynxFace Logo" width="32" height="32" class="rounded">
          <span class="text-xl font-bold text-gray-900">LynxFace</span>
        </a>
        
        <!-- Added dark mode toggle button to desktop navigation -->
        <div class="hidden md:flex space-x-8 items-center">
          <a href="index.html" class="text-gray-700 hover:text-cyan-600 transition">Home</a>
          <a href="analyze.html" class="text-gray-700 hover:text-cyan-600 transition">Analyze</a>
          <a href="privacy.html" class="text-gray-700 hover:text-cyan-600 transition">Privacy</a>
          <a href="contact.html" class="text-cyan-600 font-semibold border-b-2 border-cyan-600 pb-1">Contact</a>
          <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-100 transition focus:outline-none focus:ring-2 focus:ring-cyan-500" aria-label="Toggle dark mode">
            <svg id="theme-icon-light" class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <svg id="theme-icon-dark" class="w-5 h-5 text-gray-700 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
          </button>
        </div>
        
        <button id="mobile-menu-btn" class="md:hidden text-gray-700 focus:outline-none focus:ring-2 focus:ring-cyan-500 rounded p-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
      
      <!-- Added dark mode toggle to mobile menu -->
      <div id="mobile-menu" class="hidden md:hidden pb-4">
        <a href="index.html" class="block py-2 text-gray-700 hover:text-cyan-600">Home</a>
        <a href="analyze.html" class="block py-2 text-gray-700 hover:text-cyan-600">Analyze</a>
        <a href="privacy.html" class="block py-2 text-gray-700 hover:text-cyan-600">Privacy</a>
        <a href="contact.html" class="block py-2 text-cyan-600 font-semibold">Contact</a>
        <button id="theme-toggle-mobile" class="flex items-center py-2 text-gray-700 hover:text-cyan-600 w-full">
          <svg id="theme-icon-mobile" class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
          <span id="theme-text-mobile">Dark Mode</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="fade-enter">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <h1 class="text-4xl font-bold text-gray-900 mb-8">Contact Us</h1>
      
      <div id="form-banner" class="hidden"></div>
      
      <form id="contact-form" class="space-y-6">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Name</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
            placeholder="Your name"
          >
        </div>
        
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
            placeholder="your.email@example.com"
          >
        </div>
        
        <div>
          <label for="message" class="block text-sm font-medium text-gray-700 mb-2">Message</label>
          <textarea 
            id="message" 
            name="message" 
            rows="6" 
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition resize-none"
            placeholder="Your message..."
          ></textarea>
        </div>
        
        <button 
          type="submit" 
          class="w-full bg-gradient-to-r from-cyan-600 to-indigo-600 text-white font-semibold px-6 py-3 rounded-lg shadow-md hover:shadow-lg transition-all transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2"
        >
          Send Message
        </button>
      </form>
    </div>
  </main>

  <footer class="bg-gray-50 border-t border-gray-200 mt-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <p class="text-center text-gray-600 mb-4">
        © 2025 LynxFace – AI Face Analyzer. All rights reserved.<br>
        Built by Ali Hasanli.
      </p>
      <div class="flex flex-wrap justify-center gap-6 text-sm">
        <a href="index.html" class="text-cyan-600 hover:underline">Home</a>
        <a href="analyze.html" class="text-cyan-600 hover:underline">Analyze</a>
        <a href="privacy.html" class="text-cyan-600 hover:underline">Privacy</a>
        <a href="contact.html" class="text-cyan-600 hover:underline">Contact</a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
